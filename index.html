<style>
  :root {

      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171D36;
    --bg-dots: rgba(255, 246, 230, 0.07);

    --c2: #5BA8FF;

    en: { install: "Install as app", ios: "On iPhone: tap the Share icon, then “Add to Home Screen”." },
    de: { install: "Als App installieren", ios: "iPhone: Teilen-Symbol tippen, dann „Zum Home-Bildschirm“." }
  };
  var btn = document.getElementById("install"), hint = document.getElementById("ioshint"), deferred = null;
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
  function txt() {
    var l = document.documentElement.lang === "de" ? "de" : "en";
    btn.textContent = L[l].install; hint.textContent = L[l].ios;
  }
  txt();
  new MutationObserver(txt).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  if (!standalone) {
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; btn.hidden = false; });
    btn.addEventListener("click", function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; btn.hidden = true; });
    });
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (ios) hint.hidden = false;
  }
  window.addEventListener("appinstalled", function () { btn.hidden = true; hint.hidden = true; });
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
<script>
(function () {
  var NUM = "4915166924364";
  var M = {
    en: { yes: "Hi Tripathis! Yes, we’ll be at Ryna’s 2nd birthday on Sat 21 Nov at Jaggis 🎈 We will be [number] people.",
          no: "Hi Tripathis! Sorry, we can’t make it to Ryna’s birthday on 21 Nov. Happy birthday to her! 💛" },
    de: { yes: "Hallo Tripathis! Ja, wir sind bei Rynas 2. Geburtstag am Sa 21.11. im Jaggis dabei 🎈 Wir sind [Anzahl] Personen.",
          no: "Hallo Tripathis! Leider können wir am 21.11. nicht zu Rynas Geburtstag kommen. Alles Gute für sie! 💛" }
  };
  var yes = document.getElementById("rsvpYes"), no = document.getElementById("rsvpNo"), bd = document.getElementById("bday");
  function lang() { return document.documentElement.lang === "de" ? "de" : "en"; }
  function apply() {
    var l = lang();
    yes.href = "https://wa.me/" + NUM + "?text=" + encodeURIComponent(M[l].yes);
    no.href = "https://wa.me/" + NUM + "?text=" + encodeURIComponent(M[l].no);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var birthday = new Date(2026, 10, 19);
    var txt;
    if (today >= birthday) {
      txt = l === "de" ? "🎂 Ryna ist 2 Jahre alt!" : "🎂 Ryna is 2 years old!";
    } else {
      var months = (today.getFullYear() - 2024) * 12 + (today.getMonth() - 10) - (today.getDate() < 19 ? 1 : 0);
      var days = Math.round((birthday - today) / 86400000);
      if (l === "de") txt = "🎂 " + months + " Monate alt · wird in " + days + (days === 1 ? " Tag" : " Tagen") + " 2";
      else txt = "🎂 " + months + " months old · turns 2 in " + days + (days === 1 ? " day" : " days");
    }
    bd.textContent = txt;
  }
  apply();
  new MutationObserver(apply).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  setInterval(apply, 3600000);
})();
</script>
