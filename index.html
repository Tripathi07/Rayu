<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #FFF6E6;
    --bg-dots: rgba(31, 42, 68, 0.07);
    --ink: #1F2A44;
    --ink-soft: #46506B;
    --card: #FFFFFF;
    --line: rgba(31, 42, 68, 0.25);
    --sun: #FFC93C;
    --c1: #E0402F;
    --c2: #2573DA;
    --c3: #1A9457;
    --c4: #7447CC;
    --c5: #E27A06;
    --btn-bg: #1F2A44;
    --btn-fg: #FFF6E6;
    --sign: #1F5FBF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171D36;
      --bg-dots: rgba(255, 246, 230, 0.07);
      --ink: #FFF6E6;
      --ink-soft: #C6CCE0;
      --card: #222A4A;
      --line: rgba(255, 246, 230, 0.3);
      --c1: #FF6B5A;
      --c2: #5BA8FF;
      --c3: #4FD08A;
      --c4: #A583FF;
      --c5: #FFA23A;
      --btn-bg: #FFC93C;
      --btn-fg: #1F2A44;
      --sign: #4A8DF0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171D36;
    --bg-dots: rgba(255, 246, 230, 0.07);
    --ink: #FFF6E6;
    --ink-soft: #C6CCE0;
    --card: #222A4A;
    --line: rgba(255, 246, 230, 0.3);
    --c1: #FF6B5A;
    --c2: #5BA8FF;
    --c3: #4FD08A;
    --c4: #A583FF;
    --c5: #FFA23A;
    --btn-bg: #FFC93C;
    --btn-fg: #1F2A44;
    --sign: #4A8DF0;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dots) 2px, transparent 2.5px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.05rem;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
    min-height: 100%;
  }
  h1, h2, h3, .display { font-family: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif; margin: 0; line-height: 1.05; }
  p { margin: 0; }
  a { color: inherit; }

  .wrap { width: min(100% - 2.5rem, 44rem); margin-inline: auto; position: relative; z-index: 2; }

  /* language switch */
  .lang { position: absolute; top: 0.9rem; right: 1rem; z-index: 5; display: flex; gap: 0.25rem; background: var(--card); border-radius: 999px; padding: 0.2rem; box-shadow: 0 0 0 1.5px var(--line); }
  .lang button { font: inherit; font-size: 0.85rem; font-weight: 700; border: 0; background: transparent; color: var(--ink-soft); padding: 0.25rem 0.7rem; border-radius: 999px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-fg); }
  :focus-visible { outline: 3px solid var(--c2); outline-offset: 3px; }

  /* hero */
  .hero { text-align: center; padding: 3.2rem 0 1.5rem; }
  .balloon-two { display: block; width: min(62vw, 270px); margin: 0 auto; cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  .balloon-two svg { width: 100%; height: auto; overflow: visible; display: block; }
  .bob { animation: bob 4.5s ease-in-out infinite; transform-origin: 50% 100%; }
  .sway { animation: sway 4.5s ease-in-out infinite; transform-origin: 100px 262px; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }
  @keyframes sway { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } }
  .hint { font-size: 0.9rem; color: var(--ink-soft); margin-top: 0.4rem; min-height: 1.4em; }

  h1 { font-size: clamp(2.8rem, 12vw, 5rem); font-weight: 700; margin-top: 0.8rem; letter-spacing: 0.01em; }
  h1 .l { display: inline-block; color: var(--lc); animation: pop 0.7s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(0.5s + var(--i) * 70ms); }
  h1 .sp { display: inline-block; width: 0.3em; }
  @keyframes pop {
    from { transform: translateY(-1.4em) scale(0.3) rotate(-18deg); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .sub { max-width: 32rem; margin: 1.1rem auto 0; color: var(--ink-soft); font-size: 1.15rem; }

  /* countdown */
  .count { display: flex; justify-content: center; gap: 0.7rem; margin: 2rem 0 0.5rem; flex-wrap: wrap; }
  .count .u { min-width: 4.6rem; padding: 0.55rem 0.6rem 0.4rem; border-radius: 1.2rem; background: var(--card); box-shadow: 0 0 0 2px var(--line); text-align: center; }
  .count .n { font-family: "Fredoka", system-ui, sans-serif; font-weight: 600; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; display: block; }
  .count .t { font-size: 0.85rem; color: var(--ink-soft); }
  .count .u:nth-child(1) .n { color: var(--c1); }
  .count .u:nth-child(2) .n { color: var(--c2); }
  .count .u:nth-child(3) .n { color: var(--c3); }
  .count .u:nth-child(4) .n { color: var(--c4); }
  .live { font-family: "Fredoka", system-ui, sans-serif; font-size: 2rem; font-weight: 600; color: var(--c1); margin: 2rem 0 0.5rem; text-align: center; }

  /* ticket */
  .ticket { display: grid; grid-template-columns: 15rem 1fr; margin: 2.5rem 0 0; filter: drop-shadow(0 6px 0 var(--line)); }
  .stub { background: var(--sun); color: #1F2A44; padding: 1.6rem 1.4rem; border-radius: 1.6rem 0 0 1.6rem; text-align: center; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; }
  .stub .day { font-family: "Fredoka", system-ui, sans-serif; font-weight: 700; font-size: 5.2rem; line-height: 0.9; }
  .stub .wd { font-family: "Fredoka", system-ui, sans-serif; font-weight: 600; font-size: 1.5rem; margin-top: 0.3rem; }
  .stub .mo { font-weight: 700; }
  .stub .time { margin-top: 0.8rem; background: #1F2A44; color: #FFF6E6; font-weight: 700; padding: 0.3rem 0.95rem; border-radius: 999px; font-size: 1rem; white-space: nowrap; }
  .stub::before, .stub::after { content: ""; position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); right: -13px; z-index: 1; }
  .stub::before { top: -13px; }
  .stub::after { bottom: -13px; }
  .place { background: var(--card); padding: 1.6rem 1.7rem; border-radius: 0 1.6rem 1.6rem 0; border-left: 3px dashed var(--line); display: flex; flex-direction: column; justify-content: center; gap: 0.35rem; }
  .place h2 { font-size: 2.3rem; font-weight: 700; color: var(--c2); }
  .place address { font-style: normal; color: var(--ink-soft); }
  .btns { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.9rem; }
  .btn { display: inline-block; text-decoration: none; font-weight: 700; font-size: 0.95rem; padding: 0.55rem 1.05rem; border-radius: 999px; transition: transform 0.15s ease; }
  .btn.main { background: var(--btn-bg); color: var(--btn-fg); }
  .btn.alt { box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(1px); }

  /* parking */
  .parking { margin-top: 3.5rem; }
  .parking h2 { font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 700; color: var(--c3); }
  .parking p.txt { margin-top: 0.6rem; max-width: 34rem; color: var(--ink-soft); }
  .photo { position: relative; margin: 1.4rem 0 0; transform: rotate(-1deg); }
  .photo img { display: block; width: 100%; height: auto; border-radius: 1.2rem; border: 7px solid var(--card); box-shadow: 0 0 0 2px var(--line), 0 10px 0 var(--line); }
  .pin { position: absolute; left: 77%; top: 63%; width: 3.1rem; height: 3.1rem; border-radius: 50%; background: var(--sign); color: #fff; font-family: "Fredoka", system-ui, sans-serif; font-weight: 700; font-size: 1.8rem; display: grid; place-items: center; box-shadow: 0 0 0 3px #fff; transform: translate(-50%, -50%); }
  .pin::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 0 0 var(--sign); animation: ping 2.2s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(37, 115, 218, 0.7); } 100% { box-shadow: 0 0 0 26px rgba(37, 115, 218, 0); } }
  .photo figcaption { font-size: 0.9rem; color: var(--ink-soft); margin-top: 0.9rem; text-align: center; }

  /* outro */
  .outro { text-align: center; padding: 4rem 0 4.5rem; }
  .outro h2 { font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 700; max-width: 26rem; margin-inline: auto; }
  .outro p { margin-top: 0.7rem; color: var(--ink-soft); font-size: 1.15rem; }
  .dots { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.4rem; }
  .dots i { width: 0.8rem; height: 0.8rem; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: var(--c1); } .dots i:nth-child(2) { background: var(--sun); } .dots i:nth-child(3) { background: var(--c3); } .dots i:nth-child(4) { background: var(--c2); } .dots i:nth-child(5) { background: var(--c4); }

  .outro .sign { font-family: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif; font-weight: 600; font-size: 1.7rem; color: var(--c1); margin-top: 1.6rem; }

  .install-box { margin-top: 1.8rem; }

  /* flying balloons + confetti */
  #sky { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .fly { position: absolute; bottom: 0; left: var(--x); width: var(--s); height: calc(var(--s) * 1.25); border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.65) 0 9%, transparent 22%), var(--bc); animation: rise var(--d) ease-in var(--delay) both; will-change: transform; }
  .fly::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: calc(var(--s) * 1.1); background: var(--ink); opacity: 0.35; }
  @keyframes rise {
    0% { transform: translate(0, 120%); }
    50% { transform: translate(var(--dx), calc(-60vh)); }
    100% { transform: translate(0, calc(-120vh - 200px)); }
  }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  @media (max-width: 40rem) {
    .ticket { grid-template-columns: 1fr; }
    .stub { border-radius: 1.6rem 1.6rem 0 0; }
    .stub::before, .stub::after { right: auto; top: auto; bottom: -13px; }
    .stub::before { left: -13px; }
    .stub::after { right: -13px; }
    .place { border-left: 0; border-top: 3px dashed var(--line); border-radius: 0 0 1.6rem 1.6rem; }
    .stub .day { font-size: 4.4rem; }
    .pin { width: 2.5rem; height: 2.5rem; font-size: 1.4rem; }
  }
</style>
</head>

  var reduce = false;
  var lang = (navigator.language || "en").slice(0, 2) === "de" ? "de" : "en";

  function renderTitle(text) {
    var h = document.getElementById("title");
    h.textContent = "";
    h.setAttribute("aria-label", text);
    var idx = 0;
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      var span = document.createElement("span");
      span.setAttribute("aria-hidden", "true");
      if (ch === " ") { span.className = "sp"; }
      else {
        span.className = "l";
        span.textContent = ch;
        span.style.setProperty("--i", idx);
        span.style.setProperty("--lc", "var(--c" + ((idx % 5) + 1) + ")");
        idx++;
      }
      h.appendChild(span);
    }
  }

  function setLang(l, animate) {
    lang = l;
    document.documentElement.lang = l;
    var dict = T[l];
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = dict[nodes[i].getAttribute("data-i18n")];
    }
    renderTitle(dict.title);
    var btns = document.querySelectorAll(".lang button");
    for (var j = 0; j < btns.length; j++) {
      btns[j].setAttribute("aria-pressed", btns[j].getAttribute("data-lang") === l ? "true" : "false");
    }
    document.title = dict.title + " · 21.11. Jaggis";
    tick();
  }

  /* countdown to Sat 21 Nov 2026, 11:30 Frankfurt time (UTC+1) */
  var target = new Date("2026-11-21T11:30:00+01:00").getTime();
  var cd = document.getElementById("countdown");
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function tick() {
    var diff = target - Date.now();
    var dict = T[lang];
    if (diff <= 0) {
      cd.innerHTML = '<p class="live"></p>';
      cd.firstChild.textContent = dict.live;
      return;
    }
    var s = Math.floor(diff / 1000);
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.floor(s / 60); s -= m * 60;
    var vals = [[d, dict.d], [pad(h), dict.h], [pad(m), dict.m], [pad(s), dict.s]];
    var html = '<div class="count" role="timer">';
    for (var i = 0; i < vals.length; i++) {
      html += '<div class="u"><span class="n">' + vals[i][0] + '</span><span class="t">' + vals[i][1] + '</span></div>';
    }
    cd.innerHTML = html + "</div>";
  }
  setInterval(tick, 1000);

  /* language buttons */
  var lb = document.querySelectorAll(".lang button");
  for (var k = 0; k < lb.length; k++) {
    lb[k].addEventListener("click", function () { setLang(this.getAttribute("data-lang")); });
  }

  /* balloons rising once on load */
  function release(count) {
    if (reduce) return;
    var sky = document.getElementById("sky");
    var cols = ["#E0402F", "#FFC93C", "#2573DA", "#1A9457", "#7447CC", "#E27A06", "#FF7BAC"];
    for (var i = 0; i < count; i++) {
      var b = document.createElement("div");
      b.className = "fly";
      var size = 38 + Math.random() * 40;
      b.style.setProperty("--x", (Math.random() * 92) + "%");
      b.style.setProperty("--s", size + "px");
      b.style.setProperty("--bc", cols[i % cols.length]);
      b.style.setProperty("--d", (7 + Math.random() * 5) + "s");
      b.style.setProperty("--delay", (0.2 + Math.random() * 1.6) + "s");
      b.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
      sky.appendChild(b);
      (function (el) { el.addEventListener("animationend", function () { el.remove(); }); })(b);
    }
  }

  /* confetti */
  var cv = document.getElementById("confetti");
  var ctx = cv.getContext("2d");
  var parts = [], running = false;
  function fit() {
    var r = window.devicePixelRatio || 1;
    cv.width = window.innerWidth * r;
    cv.height = window.innerHeight * r;
    ctx.setTransform(r, 0, 0, r, 0, 0);
  }
  window.addEventListener("resize", fit);
  fit();
  function burst(x, y, n) {
    if (reduce) return;
    var cols = ["#E0402F", "#FFC93C", "#2573DA", "#1A9457", "#7447CC", "#FF7BAC", "#E27A06"];
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 9;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6, w: 6 + Math.random() * 7, h: 4 + Math.random() * 5, r: Math.random() * 6, vr: Math.random() * 0.4 - 0.2, c: cols[i % cols.length], life: 0 });
    }
    if (!running) { running = true; requestAnimationFrame(frame); }
  }
  function frame() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      if (p.y > window.innerHeight + 30 || p.life > 240) { parts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - p.life / 240);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(frame);
    else { running = false; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }

  var two = document.getElementById("two");
  two.addEventListener("click", function (e) {
    var r = two.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * 0.4, 140);
    var hint = document.getElementById("hint");
    if (hint) hint.textContent = "";
  });

  setLang(lang);
  release(14);
  setTimeout(function () {
    var r = two.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * 0.4, 110);
  }, 700);
})();
</script>
<script>
(function () {
  var L = {
    en: { install: "Install as app", ios: "On iPhone: tap the Share icon, then “Add to Home Screen”." },
    de: { install: "Als App installieren", ios: "iPhone: Teilen-Symbol tippen, dann „Zum Home-Bildschirm“." }
  };
  var btn = document.getElementById("install"), hint = document.getElementById("ioshint"), deferred = null;
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
  function txt() {
    var l = document.documentElement.lang === "de" ? "de" : "en";
    btn.textContent = L[l].install; hint.textContent = L[l].ios;
  }
  txt();
  new MutationObserver(txt).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  if (!standalone) {
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; btn.hidden = false; });
    btn.addEventListener("click", function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; btn.hidden = true; });
    });
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (ios) hint.hidden = false;
  }
  window.addEventListener("appinstalled", function () { btn.hidden = true; hint.hidden = true; });
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
