  .snd.attn { animation: sndpulse 1.1s ease-in-out infinite; box-shadow: 0 0 0 3px #FF4D7E; }
  @keyframes sndpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

  /* ---------- mouse mascot: pops out with balloon "1", it bursts, balloon "2" inflates, she rises higher ---------- */
  .mw { position: absolute; left: 50%; margin-left: -110px; bottom: calc(32% + 65px); width: 220px; height: 340px; overflow: hidden; pointer-events: none; display: none; z-index: 3; }
  .opened .mw { display: block; }
  .mouse { position: absolute; left: 0; bottom: 0; transform: translateY(300px); }
  .mouse svg { display: block; width: 220px; height: 280px; overflow: visible; transform-origin: 50% 100%; }
  .opened .mouse { animation: mrise .9s cubic-bezier(.2,1.4,.4,1) .55s both, mraise .75s cubic-bezier(.2,1.3,.4,1) 2.6s forwards; }
  @keyframes mrise { from { transform: translateY(300px); } to { transform: translateY(50px); } }
  @keyframes mraise { from { transform: translateY(50px); } to { transform: translateY(0); } }
  .opened .mouse svg { animation: msway 2.4s ease-in-out 3.4s infinite alternate; }
  @keyframes msway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
  .armL { transform-box: view-box; transform-origin: 72px 174px; }
  .opened .armL { animation: wave .45s ease-in-out 1.45s infinite alternate; }
  @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(16deg); } }
  .bal { transform-box: view-box; transform-origin: 172px 50px; }
  .opened .bal { animation: balbob .75s ease-in-out .95s 2, balpop .18s ease-out 2.4s forwards; }
  @keyframes balbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes balpop { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(1.9); opacity: 0; } }
  .bal2 { opacity: 0; transform-box: view-box; transform-origin: 172px 112px; }
  .opened .bal2 { animation: inflate .75s cubic-bezier(.2,1.6,.4,1) 2.55s both, bal2bob 1.8s ease-in-out 3.35s infinite; }
  @keyframes inflate { from { opacity: 0; transform: scale(.1); } to { opacity: 1; transform: scale(1); } }
  @keyframes bal2bob { 0%, 100% { transform: translateY(0) rotate(-2.5deg); } 50% { transform: translateY(-5px) rotate(2.5deg); } }
  .sh { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .opened .sh { animation: shard .7s ease-out 2.4s both; }
  @keyframes shard { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); } }
  .pop { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .opened .pop { animation: popt .9s ease-out 2.4s both; }
  @keyframes popt { 0% { opacity: 0; transform: scale(.3); } 25% { opacity: 1; transform: scale(1.25); } 100% { opacity: 0; transform: scale(1.1) translateY(-14px); } }
  .mouthO { opacity: 0; }
  .opened .mouthO { animation: oblip .7s linear 2.4s forwards; }
  .opened .mouthS { animation: smileback .7s linear 2.4s forwards; }
  @keyframes oblip { 0% { opacity: 1; } 99% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes smileback { 0% { opacity: 0; } 99% { opacity: 0; } 100% { opacity: 1; } }
  .rise { display: none !important; }
  .hero { padding-top: 4.4rem; }
</style>

    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var birthday = new Date(2026, 10, 19);
    var txt;
    if (today >= birthday) {
      txt = l === "de" ? "🎂 Ryna ist 2 Jahre alt!" : "🎂 Ryna is 2 years old!";
    } else {
      var months = (today.getFullYear() - 2024) * 12 + (today.getMonth() - 10) - (today.getDate() < 19 ? 1 : 0);
      var days = Math.round((birthday - today) / 86400000);
      if (l === "de") txt = "🎂 " + months + " Monate alt · wird in " + days + (days === 1 ? " Tag" : " Tagen") + " 2";
      else txt = "🎂 " + months + " months old · turns 2 in " + days + (days === 1 ? " day" : " days");
    }
    bd.textContent = txt;
  }
  apply();
  new MutationObserver(apply).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  setInterval(apply, 3600000);
})();
</script>
